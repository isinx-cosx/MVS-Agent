<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MVS Agent</title>
    <!--
      这里全部内容都是**从 DSH 渲染结果里原样搬过来的**，一字未改：
        · 先是 DSH 外壳的外链样式表（已内联）—— 含 reset 和高度基准
        · 然后是 DSH 的插件注入的 <style>
        · 最后是它渲染出来的 DOM
      没有引导协议、没有 RPC、没有垫片 —— 静态页不需要它们。

      ⚠️ 这段注释里**不要写字面量标签**（比如 body 标签本身）。
      我第一版写了，结果「给 body 加属性」的脚本正则匹配到了**注释里那个**，
      属性加在注释上、渲染毫无变化，而脚本还报「成功」。
      同类事故还有一次：注释里写了星号加斜杠，直接把块注释提前关掉。
    -->
    <!--
      base 元素是为了让**相对字体路径**在任意 URL 下都能解析。

      原因：DSH 的 CSS 里写的是 url(./fonts/X.woff2)，在它那边这条路是相对
      assets/index-*.css 解析的，也就是 assets/fonts/X.woff2。
      而我们把那些样式表**内联进了 HTML**，相对基准就变成了 **HTML 所在的 URL** ——
      于是 ./fonts/X 会去找 <页面目录>/fonts/X，全部 404（23 条 @font-face 全废）。

      把基准钉在 /dsh/（这一页的正式位置）之后：
        · 直接开 /dsh/  → 字体走 /dsh/fonts/  好
        · 在 / 上别名它  → 字体仍走 /dsh/fonts/  好（否则会去找 /fonts/）
    -->
